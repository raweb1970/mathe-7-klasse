<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#6b7280;
    --good:#16a34a;
    --bad:#dc2626;
    --radius:18px;
    --shadow:0 4px 18px rgba(30,40,80,.08);
    --c1:#4f6df5;   /* Terme */
    --c2:#e6a13d;   /* Symmetrie/Winkel */
    --c3:#2fb6a5;   /* Gleichungen/Prozent */
    --c4:#a35fd6;   /* Kenngrößen */
    --c5:#f16b6b;   /* Kongruenz/Dreiecke */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
  header.top{
    text-align:center;
    padding:18px 8px 8px;
  }
  header.top h1{
    font-size:1.5rem;
    margin:0 0 4px;
    line-height:1.25;
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
  }
  .today-card{
    border:2px solid var(--accent, var(--c1));
    position:relative;
    overflow:hidden;
  }
  .today-card .eyebrow{
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.72rem;
    font-weight:700;
    color:var(--accent, var(--c1));
    margin-bottom:6px;
  }
  .today-card h2{
    margin:0 0 6px;
    font-size:1.25rem;
  }
  .today-card .meta{
    color:var(--muted);
    font-size:.88rem;
    margin-bottom:14px;
  }
  .btn{
    display:inline-block;
    border:none;
    border-radius:999px;
    padding:13px 26px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background:var(--accent, var(--c1));
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    transition:transform .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{
    background:#eef1f8;
    color:var(--text);
    box-shadow:none;
  }
  .btn.block{display:block;width:100%;text-align:center;}
  .btn:disabled{opacity:.45;cursor:default;}
  h3.section-title{
    font-size:.95rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin:26px 0 10px 4px;
  }
  .chapter{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:14px;
    margin-bottom:10px;
    background:var(--card);
    box-shadow:var(--shadow);
    cursor:pointer;
    border-left:6px solid var(--accent);
  }
  .chapter .dot{
    width:38px;height:38px;border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;flex:0 0 auto;
  }
  .chapter .info{flex:1;}
  .chapter .info .t{font-weight:700;font-size:.98rem;}
  .chapter .info .s{color:var(--muted);font-size:.8rem;margin-top:2px;}
  .chapter .chev{color:var(--muted);font-size:1.3rem;}
  .lesson-list{margin:0 0 14px 0;}
  .lesson-row{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:8px;
    background:#f8f9fd;
    cursor:pointer;
    border:1px solid #eceff7;
  }
  .lesson-row:hover{background:#f0f2fb;}
  .lesson-row .num{
    width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:#fff;
    font-size:.78rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .lesson-row .lt{flex:1;font-size:.92rem;font-weight:600;}
  .lesson-row .badge{
    font-size:.68rem;
    background:var(--accent);
    color:#fff;
    padding:3px 8px;
    border-radius:999px;
    font-weight:700;
  }
  .back-link{
    background:none;border:none;color:var(--accent, var(--c1));
    font-weight:700;font-size:.92rem;cursor:pointer;padding:6px 0 12px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .merksatz{
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, white), color-mix(in srgb, var(--accent) 4%, white));
    border-left:5px solid var(--accent);
    border-radius:12px;
    padding:14px 16px;
    margin:12px 0;
    font-size:.95rem;
    line-height:1.5;
  }
  .merksatz b{color:var(--accent);}
  .beispiel{
    background:#f8f9fd;
    border-radius:12px;
    padding:14px 16px;
    margin:12px 0;
    font-size:.92rem;
    line-height:1.55;
    border:1px dashed #d8ddec;
  }
  .beispiel .label{font-weight:700;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .svgbox{
    background:#fff;
    border-radius:12px;
    padding:10px;
    margin:14px 0;
    text-align:center;
    border:1px solid #eceff7;
  }
  .svgbox svg{max-width:100%;height:auto;}
  .progress-bar{
    height:8px;background:#eceff7;border-radius:99px;overflow:hidden;margin-bottom:16px;
  }
  .progress-bar .fill{
    height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;
  }
  .qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem;margin-bottom:6px;}
  .question{
    font-size:1.08rem;
    font-weight:600;
    line-height:1.45;
    margin:6px 0 18px;
  }
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .option{
    text-align:left;
    padding:13px 16px;
    border-radius:12px;
    border:2px solid #e6e9f3;
    background:#fff;
    font-size:.96rem;
    cursor:pointer;
    transition:.12s ease;
  }
  .option:hover{border-color:var(--accent);}
  .option.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, white);}
  .option.correct{border-color:var(--good);background:#eafaf0;color:#14532d;}
  .option.wrong{border-color:var(--bad);background:#fdecec;color:#7f1d1d;}
  .option[disabled]{cursor:default;}
  .input-row{display:flex;gap:10px;margin-bottom:14px;}
  .input-row input{
    flex:1;
    padding:13px 14px;
    font-size:1.05rem;
    border-radius:12px;
    border:2px solid #e6e9f3;
    font-family:inherit;
  }
  .input-row input:focus{outline:none;border-color:var(--accent);}
  .feedback{
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
    font-size:.93rem;
    line-height:1.5;
  }
  .feedback.ok{background:#eafaf0;color:#14532d;border:1px solid #bfe8cd;}
  .feedback.bad{background:#fdecec;color:#7f1d1d;border:1px solid #f4c6c6;}
  .feedback .lead{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .nav-buttons{display:flex;gap:10px;}
  .result-emoji{font-size:3rem;text-align:center;margin-bottom:6px;}
  .result-score{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:4px;}
  .result-msg{text-align:center;color:var(--muted);margin-bottom:20px;font-size:.95rem;}
  .footer-note{
    text-align:center;color:var(--muted);font-size:.78rem;margin-top:28px;line-height:1.6;
  }
  .hidden{display:none !important;}
  .home-header-icon{font-size:2.2rem;margin-bottom:2px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .chip{
    font-size:.72rem;background:#eef1f8;color:var(--muted);
    padding:4px 10px;border-radius:999px;font-weight:600;
  }
  .exam-cta{
    background:#fff8ec;
    border:2px dashed var(--accent, var(--c2));
    border-radius:14px;
    padding:14px 16px;
    margin-top:16px;
  }
  .exam-cta .t{font-weight:700;margin-bottom:4px;font-size:.98rem;}
  .exam-cta .s{color:var(--muted);font-size:.85rem;line-height:1.45;}
  .exam-cta .mini-progress{font-size:.78rem;color:var(--muted);margin-top:8px;}
  .grade-badge{
    display:flex;align-items:center;justify-content:center;
    width:64px;height:64px;border-radius:50%;
    background:var(--accent, var(--c1));color:#fff;
    font-size:1.7rem;font-weight:800;
    margin:0 auto 12px;
  }
  .review-item{
    border:1px solid #eceff7;
    background:#f8fdf9;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:.88rem;
    line-height:1.5;
  }
  .review-item.wrong{border-color:#f4c6c6;background:#fff8f8;}
  .review-item .rq{font-weight:700;margin-bottom:6px;}

/* ================= STATE / ENGINE ================= */

let state = {view:"home", lessonId:null, qIndex:0, score:0, answered:false, selected:null, completedLessons:new Set()};

function todayIndex(){
  const start = new Date(2026,7,16); // 16. Aug 2026 = Tag 0
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((nowMid - startMid) / 86400000);
  const idx = ((days % LESSONS.length) + LESSONS.length) % LESSONS.length;
  return idx;
}

function getLesson(id){ return LESSONS.find(l=>l.id===id); }
function getChapter(id){ return CHAPTERS.find(c=>c.id===id); }

function go(view, opts={}){
  state.view = view;
  Object.assign(state, opts);
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function startLesson(id){
  go("lessonIntro", {lessonId:id});
}
function startQuiz(id){
  const lesson = getLesson(id);
  const quizQuestions = lesson.questions.map(shuffleOptions);
  go("quiz", {lessonId:id, quizQuestions, qIndex:0, score:0, answered:false, selected:null});
}
function selectOption(i){
  if(state.answered) return;
  state.selected = i;
  checkAnswer(i);
}
function submitInput(){
  if(state.answered) return;
  const val = document.getElementById("inp").value;
  checkAnswer(val);
}
function normalize(s){
  return String(s).trim().toLowerCase().replace(",", ".").replace(/\s+/g,"").replace("€","").replace("%","").replace("°","");
}
function isCorrectAnswer(q, val){
  if(q.type==="mc"){
    return val === q.correct;
  }
  return normalize(val) === normalize(q.answer);
}
function checkAnswer(val){
  const q = state.quizQuestions[state.qIndex];
  const isCorrect = isCorrectAnswer(q, val);
  state.answered = true;
  state.lastCorrect = isCorrect;
  state.lastVal = val;
  if(isCorrect) state.score++;
  render();
}
function nextQuestion(){
  if(state.qIndex < state.quizQuestions.length - 1){
    state.qIndex++;
    state.answered = false;
    state.selected = null;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    state.completedLessons.add(state.lessonId);
    go("result", {});
  }
}

/* ---- Schulaufgabe (Kapitel-Test) ---- */

function chapterLessons(chapterId){ return LESSONS.filter(l=>l.chapter===chapterId); }
function isChapterComplete(chapterId){
  return chapterLessons(chapterId).every(l=>state.completedLessons.has(l.id));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Mischt bei Multiple-Choice-Fragen die Reihenfolge der Antwortmöglichkeiten,
// damit die richtige Antwort nicht immer an derselben Stelle steht.
function shuffleOptions(q){
  if(q.type !== "mc") return q;
  const order = shuffle(q.options.map((_,i)=>i));
  const newOptions = order.map(i=>q.options[i]);
  const newCorrect = order.indexOf(q.correct);
  return Object.assign({}, q, {options:newOptions, correct:newCorrect});
}
function buildSchulaufgabe(chapterId){
  const lessons = chapterLessons(chapterId);
  const perLesson = lessons.length <= 1 ? 5 : 3;
  let pool = [];
  lessons.forEach(l=>{
    const picked = shuffle(l.questions).slice(0, Math.min(perLesson, l.questions.length));
    picked.forEach(q=> pool.push(Object.assign({}, shuffleOptions(q), {lessonTitle:l.title})));
  });
  return shuffle(pool);
}
function startSchulaufgabe(chapterId){
  const questions = buildSchulaufgabe(chapterId);
  go("examIntro", {examChapter:chapterId, examQuestions:questions, examIndex:0, examAnswers:[], examSelected:null});
}
function beginSchulaufgabeQuiz(){
  go("examQuiz", {examIndex:0, examAnswers:[], examSelected:null});
}
function examSelectOption(i){
  state.examSelected = i;
  render();
}
function examSubmitAndNext(){
  const q = state.examQuestions[state.examIndex];
  let val;
  if(q.type==="mc"){
    val = (state.examSelected===null || state.examSelected===undefined) ? -1 : state.examSelected;
  } else {
    const el = document.getElementById("examInp");
    val = el ? el.value : "";
  }
  const correct = isCorrectAnswer(q, val);
  state.examAnswers.push({q, val, correct});
  if(state.examIndex < state.examQuestions.length - 1){
    state.examIndex++;
    state.examSelected = null;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    go("examResult", {});
  }
}
function gradeFromPercent(pct){
  if(pct>=92) return {note:1, label:"sehr gut"};
  if(pct>=81) return {note:2, label:"gut"};
  if(pct>=67) return {note:3, label:"befriedigend"};
  if(pct>=50) return {note:4, label:"ausreichend"};
  if(pct>=25) return {note:5, label:"mangelhaft"};
  return {note:6, label:"ungenügend"};
}

/* ================= RENDER ================= */

function render(){
  const app = document.getElementById("app");
  if(state.view==="chapterView") app.innerHTML = renderChapterView(state.currentChapter);
  else if(state.view==="home") app.innerHTML = renderHome();
  else if(state.view==="lessonIntro") app.innerHTML = renderLessonIntro();
  else if(state.view==="quiz") app.innerHTML = renderQuiz();
  else if(state.view==="result") app.innerHTML = renderResult();
  else if(state.view==="examIntro") app.innerHTML = renderExamIntro();
  else if(state.view==="examQuiz") app.innerHTML = renderExamQuiz();
  else if(state.view==="examResult") app.innerHTML = renderExamResult();
  attachHandlers();
}

function renderQuiz(){
  const lesson = getLesson(state.lessonId);
  const ch = getChapter(lesson.chapter);
  const q = state.quizQuestions[state.qIndex];
  const total = state.quizQuestions.length;
  const pct = Math.round(((state.qIndex) / total) * 100);
  let html = `<div class="card" style="--accent:${ch.color}">
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="qmeta"><span>${ch.icon} ${lesson.title}</span><span>Frage ${state.qIndex+1} / ${total}</span></div>
    <div class="question">${q.q}</div>`;

  if(q.type==="mc"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      let cls = "option";
      if(state.answered){
        if(i===q.correct) cls += " correct";
        else if(i===state.selected) cls += " wrong";
      } else if(i===state.selected){
        cls += " selected";
      }
      html += `<button class="${cls}" data-action="option" data-i="${i}" ${state.answered?"disabled":""}>${opt}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="input-row">
      <input id="inp" type="text" inputmode="decimal" placeholder="Deine Antwort" ${state.answered?"disabled":""} value="${state.answered?state.lastVal:""}">
      ${!state.answered? `<button class="btn" style="--accent:${ch.color}" data-action="submit">OK</button>`:""}
    </div>`;
  }

  if(state.answered){
    const ok = state.lastCorrect;
    html += `<div class="feedback ${ok?'ok':'bad'}">
      <div class="lead">${ok? '✅ Richtig!' : '❌ Nicht ganz.'}</div>
      ${q.explain}
    </div>
    <button class="btn block" style="--accent:${ch.color}" data-action="next">${state.qIndex<total-1? 'Weiter →' : 'Ergebnis anzeigen →'}</button>`;
  }

  html += `</div>`;
  return html;
}

    <div class="result-score">${score} von ${total} richtig</div>
    <div class="result-msg">${msg}</div>

    <p style="line-height:1.55;">
      Diese Testrunde deckt <b>alle Lektionen</b> des Themas „${ch.title}" ab – gemischt, so wie bei einer echten Schulaufgabe.
      Es gibt <b>${total} Aufgaben</b>. Während der Bearbeitung gibt es keine Erklärungen – erst am Ende siehst du deine Note und eine vollständige Auswertung mit allen Lösungen.
    </p>
    <button class="btn block" style="--accent:${ch.color}" data-action="examBegin">Schulaufgabe starten 🚀</button>
  </div>`;
}

function renderExamQuiz(){
  const ch = getChapter(state.examChapter);
  const q = state.examQuestions[state.examIndex];
  const total = state.examQuestions.length;
  const pct = Math.round((state.examIndex / total) * 100);
  let html = `<div class="card" style="--accent:${ch.color}">
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="qmeta"><span>📝 Schulaufgabe · ${ch.title}</span><span>Aufgabe ${state.examIndex+1} / ${total}</span></div>
    <div class="question">${q.q}</div>`;

  if(q.type==="mc"){
    html += `<div class="options">`;
    q.options.forEach((opt,i)=>{
      const cls = "option" + (state.examSelected===i ? " selected" : "");
      html += `<button class="${cls}" data-action="exam-option" data-i="${i}">${opt}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="input-row"><input id="examInp" type="text" inputmode="decimal" placeholder="Deine Antwort"></div>`;
  }

  html += `<button class="btn block" style="--accent:${ch.color}" data-action="exam-next">${state.examIndex<total-1? 'Weiter →' : 'Abgeben ✅'}</button>
  </div>`;
  return html;
}

function renderExamResult(){
  const ch = getChapter(state.examChapter);
  const total = state.examAnswers.length;
  const score = state.examAnswers.filter(a=>a.correct).length;
  const pct = Math.round((score/total)*100);
  const g = gradeFromPercent(pct);

  let html = `<div class="card" style="--accent:${ch.color};text-align:center;">
    <div class="grade-badge" style="--accent:${ch.color}">${g.note}</div>
    <div class="result-score">${score} von ${total} Punkten (${pct}%)</div>
    <div class="result-msg">Note ${g.note} (${g.label}) – nur zur groben Orientierung, deine Lehrkraft bewertet echte Schulaufgaben ggf. nach einem anderen Punkteschlüssel.</div>
  </div>
  <h3 class="section-title">Auswertung im Detail</h3>`;

  state.examAnswers.forEach(a=>{
    const q = a.q;
    let givenText;
    if(q.type==="mc"){
      givenText = (a.val>=0 && a.val<q.options.length) ? q.options[a.val] : "(keine Antwort)";
    } else {
      givenText = (a.val && String(a.val).trim()!=="") ? a.val : "(keine Antwort)";
    }
    const correctText = q.type==="mc" ? q.options[q.correct] : q.answer;
    html += `<div class="review-item ${a.correct?'':'wrong'}">
      <div class="rq">${a.correct?'✅':'❌'} ${q.q}</div>
      <div class="ra">Deine Antwort: <b>${givenText}</b>${a.correct?'':` · Richtig: <b>${correctText}</b>`}</div>
      <div class="rex">${q.explain}</div>
    </div>`;
  });

  html += `<div class="nav-buttons" style="margin-top:16px;">
    <button class="btn secondary block" data-action="examRestart" data-id="${ch.id}">Nochmal versuchen</button>
    <button class="btn block" style="--accent:${ch.color}" data-action="home">Fertig 👋</button>
  </div>`;
  return html;
}

/* ================= EVENTS ================= */

function attachHandlers(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick = (e)=>{
      const action = el.dataset.action;
      const id = el.dataset.id ? parseInt(el.dataset.id) : null;
      if(action==="start") startLesson(id);
      else if(action==="quiz") startQuiz(id);
      else if(action==="home") go("home");
      else if(action==="lessonIntro") go("lessonIntro", {lessonId:id});
      else if(action==="chapter") { state.currentChapter = id; go("chapterView"); }
      else if(action==="chapterViewFrom") { state.currentChapter = id; go("chapterView"); }
      else if(action==="option") selectOption(parseInt(el.dataset.i));
      else if(action==="submit") submitInput();
      else if(action==="next") nextQuestion();
      else if(action==="examStart") startSchulaufgabe(id);
      else if(action==="examBegin") beginSchulaufgabeQuiz();
      else if(action==="exam-option") examSelectOption(parseInt(el.dataset.i));
      else if(action==="exam-next") examSubmitAndNext();
      else if(action==="examRestart") startSchulaufgabe(id);
    };
  });
  const inp = document.getElementById("inp");
  if(inp){
    inp.focus();
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitInput(); });
  }
  const examInp = document.getElementById("examInp");
  if(examInp){
    examInp.focus();
    examInp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") examSubmitAndNext(); });
  }
}

render();
</script>
</body>
</html>
